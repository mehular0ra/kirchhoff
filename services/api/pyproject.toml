[project]
name = "kirchhoff"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "firebase-admin==7.7.0",
  "google-cloud-firestore==2.34.1",
  "google-cloud-storage>=2.18",
  "google-adk==2.11.0",
  "google-genai>=2.30.0",
  "pandapower==3.5.6",
  "networkx==3.7",
  "shapely==2.2.0",
  "numpy>=2.1",
  "pyyaml==6.0.3",
  "pdfplumber==0.11.10",
  "reportlab==5.0.1",
  "ezdxf==1.4.4",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kirchhoff"]
