<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>S10 · Measured numbers</title>
<link rel="stylesheet" href="lib/stage.css">
<style>
  #title { position: absolute; left: 90px; top: 78px; }
  #title .h3 { font-size: 46px; }
  #tiles { position: absolute; left: 90px; right: 90px; top: 232px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile { height: 316px; padding: 26px 34px 24px; display: flex; flex-direction: column; }
  .tile .top { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
  .tile .num { display: flex; align-items: baseline; gap: 16px; }
  .tile .n { font-size: 112px; font-variant-numeric: tabular-nums; }
  .tile .of { font-size: 44px; font-weight: 560; color: var(--ink-3); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .tile .chip { font-size: 22px; }
  .tile .lb { flex: none; margin-top: 10px; font-size: 33px; font-weight: 620; letter-spacing: -0.02em; }
  .tile .bs { flex: none; margin-top: 8px; font-size: 22px; line-height: 1.35; color: var(--ink-3); }
  .tile .src { flex: none; margin-top: auto; font-family: var(--mono); font-size: 17px; line-height: 1.3; color: var(--ink-4); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid-bg" id="grid"></div>
  <div class="footnote" id="foot">Demo data is fictional · IEC-based, illustrative values · not for construction</div>
  <div id="title"><div class="eyebrow">What we measured</div><div class="h3" id="ttl">Four numbers, each from a run or a test we can repeat.</div></div>
  <div id="tiles"></div>
</div>
<script src="lib/data.js"></script>
<script src="lib/measured.js"></script>
<script src="lib/stage.js"></script>
<script>
  const { p, rise, ease, esc } = K;
  const M = window.KMEASURED;
  const I = K.D.intake;
  // Fail loudly, never fall back to a made-up number: every figure on this card is read from lib/measured.js or the recorded run.
  if (!M || !M.faults || !M.recall || !M.median || !M.cost) throw new Error('lib/measured.js is missing or incomplete');
  if (!I || !I.total) throw new Error('lib/data.js has no intake counts');

  const specs = [
    { n: String(M.faults.caught), of: `of ${M.faults.total}`, chip: `<span class="chip pass"><span class="icon-ok">✓</span>${M.faults.false_positives} false alarms</span>`,
      lb: 'planted faults caught', bs: 'Each fault aims at a rule. No rule outside the expected ones failed.', src: 'seeded-fault benchmark · runs in make test' },
    { n: String(I.verified), of: `of ${I.total}`, chip: `<span class="chip brand">${I.total - I.verified} shown as unverified</span>`,
      lb: 'tender quotes verified word for word', bs: `Recall against our own ground truth: ${M.recall.low} to ${M.recall.high}. A quote that fails is labelled, never shown as fact.`, src: `quotes: golden-capture run · recall: ${M.recall.runs} live runs` },
    { n: String(M.median.seconds), of: 's', chip: `<span class="chip">median of ${M.median.runs} runs</span>`,
      lb: 'from upload to a checker-clean design', bs: 'Time spent waiting at the human gates is not counted.', src: 'live runs on the deployed site' },
    { n: `$${M.cost.usd}`, of: '', chip: '<span class="chip">about, one run</span>',
      lb: 'Gemini cost for one full design', bs: 'Input and output tokens at list price, measured on the recorded run.', src: 'golden-capture run · 16 Oct 2026' },
  ];
  const tiles = specs.map((s) => K.el('div', 'tile card', `
    <div class="top"><div class="num"><span class="n display">0</span>${s.of ? `<span class="of">${esc(s.of)}</span>` : ''}</div><span class="chipwrap">${s.chip}</span></div>
    <div class="lb">${esc(s.lb)}</div><div class="bs">${esc(s.bs)}</div><div class="src">${esc(s.src)}</div>`, K.$('#tiles')));
  const tw = K.words(K.$('#ttl'));

  K.scene({
    duration: 12.0,
    hero: 11.0,
    render(t) {
      K.fade(K.$('#grid'), p(t, 0, 0.8));
      rise(K.$('#title .eyebrow'), p(t, 0.05, 0.5), { y: 10, blur: 4 });
      K.stagger(tw, t, 0.1, 0.05, 0.6, { y: 24, blur: 8 });
      rise(K.$('#foot'), p(t, 0.5, 0.6), { y: 0, blur: 0 });
      tiles.forEach((tile, i) => {
        const at = 1.0 + i * 2.3; // one number per spoken phrase of the voice-over (about 2.4 words a second), the last one in at about 8 s
        rise(tile, p(t, at, 0.6), { y: 36, blur: 8 });
        K.$('.n', tile).textContent = K.count(specs[i].n, p(t, at + 0.25, 1.4, ease.out3));
        rise(K.$('.chipwrap', tile), p(t, at + 1.5, 0.5), { y: 8, blur: 3 });
        K.fade(K.$('.src', tile), p(t, at + 1.7, 0.5));
      });
    },
  });
</script>
</body>
</html>
