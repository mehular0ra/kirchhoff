<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>S3 · Requirements arrive</title>
<link rel="stylesheet" href="lib/stage.css">
<style>
  #title { position: absolute; left: 90px; top: 92px; }
  #title .h3 { font-size: 46px; }
  /* Gmail (sandbox) */
  #gmail { position: absolute; left: 90px; top: 196px; width: 930px; height: 500px; overflow: hidden; }
  .gm-head { display: flex; align-items: center; gap: 16px; height: 78px; padding: 0 26px; border-bottom: 1px solid var(--line); }
  .gm-head img { height: 34px; }
  .gm-head .nm { font-size: 28px; font-weight: 560; color: var(--ink-2); letter-spacing: -0.01em; }
  .gm-head .search { flex: 1; height: 44px; border-radius: 22px; background: var(--bg-sunk); margin: 0 10px; }
  .gm-box { padding: 14px 26px 6px; font-family: var(--mono); font-size: 18px; color: var(--ink-3); display: flex; justify-content: space-between; }
  .row { position: relative; display: grid; grid-template-columns: 250px 1fr 80px; align-items: center; gap: 18px; height: 70px;
         padding: 0 26px; border-bottom: 1px solid #f0f0f3; font-size: 22px; color: var(--ink-3); background: #fff; }
  .row .from { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .day { text-align: right; font-size: 19px; }
  .row.new { height: 150px; align-items: start; padding-top: 18px; background: #f5f9ff; color: var(--ink); }
  .row.new::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: #1a73e8; }
  .row.new .from, .row.new .subj b { color: var(--ink); font-weight: 680; }
  .row.new .subj { white-space: normal; line-height: 1.3; }
  .atts { display: flex; gap: 10px; margin-top: 12px; }
  .att { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border: 1px solid var(--line-2);
         border-radius: 10px; background: #fff; font-size: 17px; color: var(--ink-2); max-width: 380px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  .pdf { flex: none; display: inline-grid; place-items: center; width: 30px; height: 22px; border-radius: 4px; background: #d93025;
         color: #fff; font: 700 11px var(--sans); letter-spacing: 0.02em; }
  #gtag { position: absolute; right: 24px; top: 22px; }
  /* other client systems */
  .src { position: absolute; top: 722px; width: 455px; height: 122px; padding: 18px 22px; }
  .src .hd { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; }
  .src .hd img { height: 30px; }
  .src .ln { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--ink-2); }
  .src .tag { position: absolute; right: 16px; top: 18px; }
  #ariba { left: 90px; }
  #drive { left: 565px; }
  /* Kirchhoff bids inbox */
  #kb { position: absolute; left: 1100px; top: 196px; width: 730px; height: 674px; padding: 0; overflow: hidden; }
  .kb-head { display: flex; align-items: center; gap: 14px; height: 78px; padding: 0 26px; border-bottom: 1px solid var(--line); }
  .kb-head .nm { font-size: 28px; font-weight: 640; letter-spacing: -0.02em; }
  .kb-head .st { margin-left: auto; }
  .sec { padding: 16px 26px 0; }
  .sec .eyebrow { font-size: 16px; }
  .doc { display: flex; align-items: center; gap: 12px; height: 46px; font-size: 20px; color: var(--ink-2); }
  .doc .kind { margin-left: auto; font-family: var(--mono); font-size: 16px; color: var(--ink-3); padding: 3px 10px;
               border-radius: 6px; background: var(--bg-sunk); }
  .doc .via { font-family: var(--mono); font-size: 15px; color: var(--ink-4); }
  #fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
  .fld { display: flex; flex-direction: column; padding: 10px 14px; border-radius: 12px; background: var(--bg-soft); }
  .fld .l { font-family: var(--mono); font-size: 15px; color: var(--ink-3); display: flex; justify-content: space-between; }
  .fld .l .ok { color: var(--pass); }
  .fld .v { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fit { position: absolute; left: 26px; right: 26px; bottom: 22px; height: 178px; border-radius: 16px; border: 1.5px solid #bfe8cf;
         background: linear-gradient(180deg, #f3fbf6, #ffffff); padding: 18px 22px; }
  #fit .top { display: flex; align-items: center; gap: 16px; }
  #verdict { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px 8px 10px; border-radius: 999px; background: var(--pass);
             color: #fff; font-size: 30px; font-weight: 680; letter-spacing: -0.01em; }
  #verdict .icon-ok { background: #fff; color: var(--pass); }
  #fit .rule { font-family: var(--mono); font-size: 16px; color: var(--ink-3); }
  #reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin-top: 12px; font-size: 19px; color: var(--ink-2); white-space: nowrap; }
  #reasons div::before { content: "✓ "; color: var(--pass); font-weight: 700; }
  #supply { margin-top: 10px; font-size: 18px; font-weight: 520; color: #9a3412; line-height: 1.3; overflow-wrap: anywhere; }
  .fly { position: absolute; z-index: 20; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 12px;
         background: #fff; border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); font-size: 18px; color: var(--ink-2); white-space: nowrap; }
  #arc { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid-bg" id="grid"></div>
  <div class="footnote" id="foot">Simulated connectors · fictional demo data</div>
  <div id="title"><div class="eyebrow">Step 1 · Requirements arrive</div><div class="h3" id="ttl">From the client's own systems, straight into intake.</div></div>

  <div id="gmail" class="card">
    <div class="gm-head"><img src="assets/logos/gmail.svg" alt=""><span class="nm">Gmail</span><span class="search"></span></div>
    <span id="gtag"></span>
    <div class="gm-box"><span id="mbox"></span><span>Inbox</span></div>
    <div id="rows"></div>
  </div>
  <div id="ariba" class="card src flat">
    <div class="hd"><img src="assets/logos/sap.svg" alt=""><span>Ariba · RFQ</span></div><span class="tag" id="atag"></span>
    <div class="ln" id="aln"></div>
  </div>
  <div id="drive" class="card src flat">
    <div class="hd"><img src="assets/logos/google-drive.svg" alt=""><span>Spec folder</span></div><span class="tag" id="dtag"></span>
    <div class="ln" id="dln"></div>
  </div>

  <div id="kb" class="card">
    <div class="kb-head"><span id="kmark"></span><span class="nm">Kirchhoff · Bids inbox</span><span class="st" id="status"></span></div>
    <div class="sec"><div class="eyebrow">Documents</div><div id="docs"></div></div>
    <div class="sec"><div class="eyebrow">Extracted · each quote found in the source</div><div id="fields"></div></div>
    <div id="fit" data-box>
      <div class="top"><span id="verdict"><span class="icon-ok">✓</span><span id="vtext"></span></span><span class="rule">Fit check · deterministic, no LLM</span></div>
      <div id="reasons"></div>
      <div id="supply"></div>
    </div>
  </div>
  <svg id="arc" viewBox="0 0 1920 1080"></svg>
  <div id="flies"></div>
</div>
<script src="lib/data.js"></script>
<script src="lib/stage.js"></script>
<script>
  const { p, rise, ease, tf, lerp, clamp, esc } = K;
  const E = K.D.email || {};
  K.$('#gtag').innerHTML = K.sandbox('Gmail · connector · sandbox');
  K.$('#atag').innerHTML = K.sandbox('simulated');
  K.$('#dtag').innerHTML = K.sandbox('simulated');
  K.$('#mbox').textContent = E.mailbox || '';
  K.$('#kmark').innerHTML = K.mark(34);

  // Inbox rows: the existing mail, then the tender lands on top.
  const rows = K.$('#rows');
  const att = E.attachments || [];
  const kindOf = (n) => (/addendum/i.test(n) ? 'addendum' : /arrangement|drawing|plan/i.test(n) ? 'drawing' : 'tender');
  const newRow = K.el('div', 'row new', `
      <span class="from">${esc(E.from_name)}<br><span style="font-weight:500;color:var(--ink-3);font-size:19px">${esc(E.from_org)}</span></span>
      <span class="subj"><b>${esc(E.subject)}</b>
        <div class="atts">${att.slice(0, 1).map((a) => `<span class="att"><span class="pdf">PDF</span>${esc(a)}</span>`).join('')}
        ${att.length > 1 ? `<span class="att" style="color:var(--ink-3)">+${att.length - 1} more</span>` : ''}</div></span>
      <span class="day">${esc(E.received)}</span>`, rows);
  const oldRows = (E.others || []).slice(0, 3).map((o) =>
    K.el('div', 'row', `<span class="from">${esc(o.from)}</span><span class="subj">${esc(o.subject)}</span><span class="day">${esc(o.day)}</span>`, rows));

  // Other channels (simulated): an RFQ in SAP Ariba and a shared Drive folder carry the other documents.
  K.$('#aln').innerHTML = `<span class="pdf">PDF</span>${esc(att[2] || '')}`;
  K.$('#dln').innerHTML = `<span class="pdf">PDF</span>${esc(att[1] || '')}`;

  // Kirchhoff side
  const docRows = att.map((a, i) => K.el('div', 'doc', `<span class="pdf">PDF</span><span>${esc(a)}</span>
      <span class="via">${['Gmail', 'Drive', 'Ariba'][i] || ''}</span><span class="kind">${kindOf(a)}</span>`, K.$('#docs')));
  const flds = (E.fields || []).slice(0, 6).map((f) => K.el('div', 'fld', `<span class="l"><span>${esc(f.label)}</span>
      <span class="${f.verified ? 'ok' : ''}">${f.verified ? '✓ found' : 'unverified'}</span></span><span class="v">${esc(f.display)}</span>`, K.$('#fields')));
  const fit = E.fit || {};
  K.$('#vtext').textContent = fit.verdict ? fit.verdict[0].toUpperCase() + fit.verdict.slice(1) : '–';
  const reasons = (fit.reasons || []).slice(0, 4).map((r) => K.el('div', '', esc(r), K.$('#reasons')));
  const S = E.supply;
  K.$('#supply').textContent = S ? `Supply check: ${S.unit} · ${S.lead_weeks} wk lead > ${S.limit_weeks} wk clause → in-stock swap` : '';
  const status = K.$('#status');
  const titleWords = K.words(K.$('#ttl'));

  // Flying documents: from each source to its row in the bids inbox.
  const flies = [];
  const arcs = [];
  K.scene({
    duration: 14.0,
    hero: 12.4,
    setup() {
      const src = [K.$('.row.new .att'), K.$('#dln'), K.$('#aln')];
      docRows.forEach((d, i) => {
        const a = src[i] && src[i].getBoundingClientRect();
        const b = d.getBoundingClientRect();
        if (!a) return;
        const f = K.el('div', 'fly', `<span class="pdf">PDF</span>${esc(att[i])}`, K.$('#flies'));
        f.style.left = a.left + 'px'; f.style.top = a.top + 'px';
        const ax = a.left, ay = a.top, bx = b.left, by = b.top + 2;
        const cx = (ax + bx) / 2, cy = Math.min(ay, by) - 140 - i * 30;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${ax + 20} ${ay + 18} Q ${cx} ${cy} ${bx + 20} ${by + 18}`);
        path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#0ea5e9'); path.setAttribute('stroke-width', '2.5');
        path.setAttribute('stroke-dasharray', '6 8'); path.setAttribute('stroke-linecap', 'round');
        K.$('#arc').appendChild(path);
        flies.push({ f, ax, ay, bx, by, cx, cy });
        arcs.push(path);
      });
    },
    render(t) {
      K.fade(K.$('#grid'), p(t, 0, 0.8));
      rise(K.$('#title .eyebrow'), p(t, 0.05, 0.5), { y: 10, blur: 4 });
      K.stagger(titleWords, t, 0.15, 0.04, 0.6, { y: 24, blur: 8 });
      rise(K.$('#foot'), p(t, 0.4, 0.6), { y: 0, blur: 0 });
      // Gmail window and the tender landing
      rise(K.$('#gmail'), p(t, 0.1, 0.7), { y: 40, blur: 6 });
      const land = p(t, 1.1, 0.7, ease.out5);
      newRow.style.marginTop = lerp(-150, 0, land).toFixed(1) + 'px';
      newRow.style.opacity = land.toFixed(3);
      newRow.style.background = `rgba(${Math.round(lerp(255, 245, land))},${Math.round(lerp(255, 249, land))},255,1)`;
      oldRows.forEach((r) => (r.style.opacity = 0.9));
      rise(K.$('#ariba'), p(t, 1.7, 0.6), { y: 30, blur: 6 });
      rise(K.$('#drive'), p(t, 1.9, 0.6), { y: 30, blur: 6 });
      // Kirchhoff panel
      rise(K.$('#kb'), p(t, 2.3, 0.7), { y: 40, blur: 6 });
      const reading = t > 3.0 && t < 8.6;
      status.innerHTML = t < 3.0 ? '<span class="chip">Waiting</span>' : reading
        ? '<span class="chip brand">Reading · Gemini</span>' : '<span class="chip pass">✓ Triaged</span>';
      // documents fly in, one per channel
      flies.forEach((fl, i) => {
        const s0 = 3.1 + i * 0.45;
        const q = p(t, s0, 1.0, ease.inOut3);
        const x = (1 - q) * (1 - q) * fl.ax + 2 * (1 - q) * q * fl.cx + q * q * fl.bx;
        const y = (1 - q) * (1 - q) * fl.ay + 2 * (1 - q) * q * fl.cy + q * q * fl.by;
        const vis = q > 0 && q < 1 ? 1 : 0;
        tf(fl.f, { x: x - fl.ax, y: y - fl.ay, s: 1 + 0.08 * Math.sin(q * Math.PI), o: vis });
        const arcLen = arcs[i].getTotalLength();
        arcs[i].style.opacity = (0.8 * K.inout(t, s0 - 0.1, s0 + 1.6, 0.3, 0.5)).toFixed(3);
        rise(docRows[i], p(t, s0 + 0.9, 0.4), { y: 8, blur: 0 });
      });
      // fields, each with its quote found
      flds.forEach((f, i) => rise(f, p(t, 5.2 + i * 0.32, 0.5), { y: 14, blur: 4 }));
      // fit verdict
      rise(K.$('#fit'), p(t, 8.6, 0.6), { y: 24, blur: 4 });
      const pv = p(t, 8.9, 0.6, ease.outBack);
      tf(K.$('#verdict'), { s: lerp(0.7, 1, pv), o: p(t, 8.9, 0.3) });
      reasons.forEach((r, i) => rise(r, p(t, 9.4 + i * 0.22, 0.45), { y: 10, blur: 0 }));
      rise(K.$('#supply'), p(t, 10.6, 0.5), { y: 8, blur: 0 });
    },
  });
</script>
</body>
</html>
