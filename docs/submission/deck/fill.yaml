# Kirchhoff deck: values only the team can fill. build_deck.py reads this file.
#
# An empty value keeps its slot as a highlighted [TBD] placeholder on the slide
# (or as a [TBD: ...] line in the speaker notes). After editing, rebuild:
#
#     uv run --script docs/submission/deck/build_deck.py
#
# Never put emails, phone numbers, keys or other personal contact details here.
# Never type an engineering value by hand: take it from the recorded run.

team:
  # Slide 15, on-slide: role and one-line background (one short sentence each).
  mehul_role_background: "AI engineer · built Kirchhoff's agents, engine and app; builds production multi-agent systems on Gemini and Google ADK; MS by Research in ML, IIIT Hyderabad"
  jayadratha_role_background: "AI researcher and former electrical engineer (IIEST Shibpur, Vikram Solar) with an MS by Research in graph ML, IIIT Hyderabad; built the bids inbox, asset agent and test suite, ran cloud"
  # Slide 15, speaker notes: two sentences per person on what each of us built
  # and the background that makes us credible here.
  notes_bios: "Jayadratha Gayen built the bids inbox, the asset agent and the end-to-end test suite, and ran Kirchhoff's cloud deployments and golden capture. He is an AI researcher and former electrical engineer (B.Tech, IIEST Shibpur) who worked at Vikram Solar and trained in grid operations at the Eastern Regional Load Despatch Centre, with an MS by Research in graph machine learning from IIIT Hyderabad, published at TMLR and ASONAM 2025, and a GSoC 2025 contributor (INCF); he also trained on low- and high-tension systems at CESC. Mehul Arora built Kirchhoff's agent layer, its deterministic engine and the web app. He builds production multi-agent LLM systems on Gemini, Google ADK and Cloud Run, and earlier did graph neural network research for his MS by Research at IIIT Hyderabad and data science on US power-market datasets."

photos:
  # Slide 15 headshots. Paths are relative to this folder, e.g. "photos/mehul.jpg".
  # Square crops work best; they are shown in a circle.
  mehul: "photos/mehul.jpg"
  jayadratha: "photos/jayadratha.jpg"

metrics:
  # Slide 10, on-slide "Per design:" bullet: measured USD per full design run.
  # Live P1→P4 run on Vertex AI, 15 Oct 2026; the golden capture may replace it.
  usd_per_run: "~$0.066 (measured on the golden-capture run, 16 Oct 2026)"
  # Slide 10, speaker notes (full sentence): Gemini tokens and USD per full run,
  # measured from the recorded run (spec §4, metric 4).
  tokens_and_usd_per_run: "Measured on the golden-capture run on Vertex AI, 16 Oct 2026: a full P1→P4 run took 177.5 s and used 10,628 input and 15,566 output tokens, about $0.066 per design at $0.75 per million input and $3.75 per million output tokens; two other live runs cost $0.068 and $0.101."
  # Slide 12, speaker notes (full sentence): median time from upload to a
  # checker-clean revision over 5 live runs, excluding human-gate time (spec §4, metric 1).
  upload_to_clean_median: "Median 149 s from the start of a run to a checker-clean revision over 3 live runs on the deployed site (143.8 s, 149.2 s and 211.4 s), excluding the time spent waiting at gates."
  # Slide 12, speaker notes (full sentence): intake accuracy against our ground truth
  # (spec §4, metric 2).
  intake_accuracy: "Requirement recall of 0.78 to 0.84 against our hand-labelled ground truth over four live runs (0.78 on the golden-capture run the site shows), with 25 of 26 extracted quotes verified word for word against the tender PDF on that run; unverified quotes are shown as unverified, never as fact."

links:
  # Slide 14: full URLs. A QR code is generated for each one that is filled.
  github_repo: "https://github.com/mehular0ra/kirchhoff"
  demo_video: "https://youtu.be/CR2-C-gjID4"

spec_verified:
  # On-slide "(spec)" markers flag numbers taken from the design spec that have not
  # yet been measured on the running product. Set a key to true once that number is
  # verified on the deployed product; the build then drops its marker.
  s04_power_topologies: true   # slide 4 grid: "2N, DR, block"
  s06_phases_gates: true       # slide 6: "Four phases. Three gates. One signed revision."
  s10_warm_instance: true      # slide 10: "1 warm Cloud Run instance"
  s10_budget_alerts: true      # slide 10: "USD 200 budget with alerts"
