# Kirchhoff deck: values only the team can fill. build_deck.py reads this file.
#
# An empty value keeps its slot as a highlighted [TBD] placeholder on the slide
# (or as a [TBD: ...] line in the speaker notes). After editing, rebuild:
#
#     uv run --script docs/submission/deck/build_deck.py
#
# Never put emails, phone numbers, keys or other personal contact details here.
# Never type an engineering value by hand: take it from the recorded run.

team:
  # Slide 15, on-slide: role and one-line background (one short sentence each).
  mehul_role_background: "AI engineer · built Kirchhoff's agents, engine and app; builds production multi-agent systems on Gemini and Google ADK; MS by Research in ML, IIIT Hyderabad"
  jayadratha_role_background: "AI research engineer · electrical engineer (IIEST Shibpur, Vikram Solar) with an MS by Research in graph ML, IIIT Hyderabad; built the bids inbox, asset agent and test suite, ran cloud"
  # Slide 15, speaker notes: two sentences per person on what each of us built
  # and the background that makes us credible here.
  notes_bios: "Mehul Arora built Kirchhoff's agent layer, its deterministic engine and the web app. He builds production multi-agent LLM systems on Gemini, Google ADK and Cloud Run, and earlier did graph neural network research for his MS by Research at IIIT Hyderabad and data science on US power-market datasets. Jayadratha Gayen built the bids inbox, the asset agent and the end-to-end test suite, and ran Kirchhoff's cloud deployments and golden capture. He is an electrical engineer (B.Tech, IIEST Shibpur) who worked at Vikram Solar and trained in grid operations at the Eastern Regional Load Despatch Centre, and an AI research engineer with an MS by Research in graph machine learning from IIIT Hyderabad, published at TMLR and ASONAM 2025."

photos:
  # Slide 15 headshots. Paths are relative to this folder, e.g. "photos/mehul.jpg".
  # Square crops work best; they are shown in a circle.
  mehul: "photos/mehul.jpg"
  jayadratha: "photos/jayadratha.jpg"

metrics:
  # Slide 10, on-slide "Per design:" bullet: measured USD per full design run.
  # Live P1→P4 run on Vertex AI, 15 Oct 2026; the golden capture may replace it.
  usd_per_run: "~$0.057 (measured on a live run, 15 Oct 2026)"
  # Slide 10, speaker notes (full sentence): Gemini tokens and USD per full run,
  # measured from the recorded run (spec §4, metric 4).
  tokens_and_usd_per_run: "Measured on a live run, 15 Oct 2026: a full P1→P4 run on Vertex AI took 176.5 s and used 10,432 input tokens and 12,991 output tokens, about $0.057 per design at $0.75 per million input and $3.75 per million output tokens. The golden capture may replace this figure."
  # Slide 12, speaker notes (full sentence): median time from upload to a
  # checker-clean revision over 5 live runs, excluding human-gate time (spec §4, metric 1).
  upload_to_clean_median: ""
  # Slide 12, speaker notes (full sentence): intake accuracy against our ground truth
  # (spec §4, metric 2).
  intake_accuracy: "Measured on a live intake run on Vertex AI, 15 Oct 2026: requirement recall 0.84 against our hand-labelled ground truth for the Hall A tender, with 27 of 28 extracted quotes verified word for word against the tender PDF; the one unverified quote was shown as unverified, never as fact."

sources:
  # Slide 12, speaker notes: citation for the 4–8 week first-coordinated-electrical-package baseline.
  first_package_baseline: ""

links:
  # Slide 14: full URLs. A QR code is generated for each one that is filled.
  github_repo: "https://github.com/mehular0ra/kirchhoff"
  demo_video: ""

spec_verified:
  # On-slide "(spec)" markers flag numbers taken from the design spec that have not
  # yet been measured on the running product. Set a key to true once that number is
  # verified on the deployed product; the build then drops its marker.
  s04_power_topologies: ""   # slide 4 grid: "2N, DR, block"
  s06_phases_gates: ""       # slide 6: "Four phases. Three gates. One signed revision."
  s10_warm_instance: ""      # slide 10: "1 warm Cloud Run instance"
  s10_budget_alerts: ""      # slide 10: "USD 200 budget with alerts"
